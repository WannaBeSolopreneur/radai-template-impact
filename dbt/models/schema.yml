version: 2

models:
  - name: metric_time_spine
    description: Daily calendar for the semantic layer. Not a customer table.
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        granularity: day
        data_tests: [unique, not_null]

  - name: stg_customers
    description: One row per customer in the raw feed, including the customer used only for isolation tests.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: customer_name
        data_tests: [not_null]

  - name: stg_sites
    description: Imaging sites. Pine Cove is the tiny site.
    columns:
      - name: site_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: size_band
        data_tests:
          - accepted_values:
              arguments:
                values: ["large", "medium", "small", "tiny"]

  - name: stg_radiologists
    description: Synthetic radiologist labels. These are not personal names.
    columns:
      - name: radiologist_id
        data_tests: [unique, not_null]
      - name: site_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_sites')
                field: site_id

  - name: stg_generation_meta
    description: One row of run settings written by the generator.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: launch_at
        data_tests: [not_null]
      - name: partial_start
        data_tests: [not_null]

  - name: stg_template_catalog
    description: Old and new templates by modality and specialty.
    columns:
      - name: template_id
        data_tests: [unique, not_null]
      - name: modality
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["CT", "MRI", "XR", "US"]
      - name: template_version
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["old", "new"]

  - name: stg_studies
    description: One row per study after the latest ingest wins. Clock skew under 15 minutes is shifted forward. Blank modality is filled from the template.
    columns:
      - name: study_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: site_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_sites')
                field: site_id
      - name: radiologist_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_radiologists')
                field: radiologist_id
      - name: modality
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["CT", "MRI", "XR", "US"]
      - name: priority
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["STAT", "routine"]
      - name: template_version
        data_tests:
          - accepted_values:
              arguments:
                values: ["old", "new"]
      - name: template_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_template_catalog')
                field: template_id
              config:
                where: "template_id is not null"
      - name: ai_impression_status
        data_tests:
          - accepted_values:
              arguments:
                values: ["accepted", "edited", "rejected"]
      - name: exam_completed_at
        data_tests: [not_null]
      - name: report_started_at
        data_tests: [not_null]
      - name: report_signed_at
        data_tests: [not_null]

  - name: int_studies
    description: Study spine for every customer, with clocks, period, and the partial-day flag. Test fixtures are still here so marts can prove they were removed.
    columns:
      - name: study_id
        data_tests: [unique, not_null]
      - name: period
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["before", "after"]
      - name: turnaround_minutes
        data_tests: [not_null]
      - name: time_on_report_minutes
        data_tests: [not_null]

  - name: fct_studies
    description: Northbay studies only. Test fixtures are excluded. Partial days remain, flagged, so the lag is visible.
    columns:
      - name: study_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests: [not_null]
      - name: site_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_site')
                field: site_id
      - name: radiologist_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_radiologist')
                field: radiologist_id
      - name: modality
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["CT", "MRI", "XR", "US"]
      - name: priority
        data_tests:
          - accepted_values:
              arguments:
                values: ["STAT", "routine"]
      - name: period
        data_tests:
          - accepted_values:
              arguments:
                values: ["before", "after"]
      - name: is_test_fixture
        data_tests:
          - accepted_values:
              arguments:
                values: [0]
      - name: is_partial_period
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]

  - name: fct_studies_metric
    description: The population every headline metric uses. Partial days and fixtures are out.
    columns:
      - name: study_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests: [not_null]
      - name: is_partial_period
        data_tests:
          - accepted_values:
              arguments:
                values: [0]
      - name: used_template
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]

  - name: dim_customer
    description: The one customer this build is allowed to publish.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]

  - name: dim_site
    description: Northbay sites that appear on the fact.
    columns:
      - name: site_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests: [not_null]
      - name: size_band
        data_tests:
          - accepted_values:
              arguments:
                values: ["large", "medium", "small", "tiny"]

  - name: dim_radiologist
    description: Northbay radiologist labels that appear on the fact.
    columns:
      - name: radiologist_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests: [not_null]

  - name: mart_headline
    description: One row of governed headline numbers for the featured customer.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: n_studies
        data_tests: [not_null]
      - name: raw_change_minutes
        data_tests: [not_null]
      - name: adjusted_change_minutes
        data_tests: [not_null]
      - name: adjusted_report_change_minutes
        data_tests: [not_null]

  - name: mart_case_mix_weights
    description: Pre-launch modality shares. They sum to 1 and they are the fixed mix.
    columns:
      - name: modality
        data_tests:
          - not_null
          - unique
          - accepted_values:
              arguments:
                values: ["CT", "MRI", "XR", "US"]
      - name: weight
        data_tests: [not_null]
      - name: customer_id
        data_tests: [not_null]

  - name: mart_case_mix_change
    description: Raw change beside the mix-adjusted change. Negative means faster.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: adjusted_change_minutes
        data_tests: [not_null]
      - name: raw_change_minutes
        data_tests: [not_null]

  - name: mart_modality_period
    description: Medians by modality and period, plus All and the full window.
    columns:
      - name: modality
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["All", "CT", "MRI", "XR", "US"]
      - name: period
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["before", "after", "all"]
      - name: customer_id
        data_tests: [not_null]
      - name: n_studies
        data_tests: [not_null]

  - name: mart_weekly_turnaround
    description: Weekly median turnaround, for All and for each modality.
    columns:
      - name: week_start
        data_tests: [not_null]
      - name: modality
        data_tests:
          - accepted_values:
              arguments:
                values: ["All", "CT", "MRI", "XR", "US"]
      - name: customer_id
        data_tests: [not_null]
      - name: too_few_studies
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]

  - name: mart_site_turnaround
    description: Median turnaround by site. Pine Cove is flagged when n is under 30.
    columns:
      - name: site_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_site')
                field: site_id
      - name: customer_id
        data_tests: [not_null]
      - name: too_few_studies
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]

  - name: mart_heatmap
    description: Median turnaround by weekday and hour. Monday is 0.
    columns:
      - name: dow_index
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3, 4, 5, 6]
      - name: exam_hour
        data_tests: [not_null]
      - name: customer_id
        data_tests: [not_null]
      - name: too_few_studies
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]

  - name: mart_modality_box
    description: Percentile boxes for time on report. Whiskers on the page are p10 and p90.
    columns:
      - name: modality
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["CT", "MRI", "XR", "US"]
      - name: period
        data_tests:
          - accepted_values:
              arguments:
                values: ["before", "after"]
      - name: customer_id
        data_tests: [not_null]
      - name: p50
        data_tests: [not_null]

  - name: mart_ai_specialty
    description: AI impression counts by specialty after the launch.
    columns:
      - name: specialty
        data_tests: [not_null]
      - name: ai_impression_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["accepted", "edited", "rejected"]
      - name: customer_id
        data_tests: [not_null]
      - name: n_studies
        data_tests: [not_null]

  - name: mart_partial_period
    description: How many Northbay studies sit in the two days that are still loading.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: partial_studies
        data_tests: [not_null]

  - name: stg_accounts
    description: Customer accounts for the fictional vendor, including one inactive account.
    columns:
      - name: account_id
        data_tests: [unique, not_null]
      - name: segment
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["radiology_group", "health_system"]
      - name: is_active
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]

  - name: stg_opportunities
    description: Deals with a stage, a channel, and an outcome.
    columns:
      - name: opportunity_id
        data_tests: [unique, not_null]
      - name: outcome
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["open", "won", "lost"]
      - name: furthest_stage
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["lead", "meeting", "demo", "pilot", "contract", "won"]

  - name: stg_marketing_spend
    description: Quarter spend by channel.
    columns:
      - name: channel
        data_tests: [unique, not_null]
      - name: spend
        data_tests: [not_null]

  - name: stg_goals
    description: One target per goal for the current quarter.
    columns:
      - name: goal_id
        data_tests: [unique, not_null]
      - name: metric_kind
        data_tests:
          - accepted_values:
              arguments:
                values: ["pace", "snapshot"]
      - name: target_value
        data_tests: [not_null]

  - name: stg_quarter
    description: Quarter bounds and the cutoffs that decide on track, at risk, and behind.
    columns:
      - name: quarter_start
        data_tests: [not_null]
      - name: on_track_ratio
        data_tests: [not_null]

  - name: fct_opportunities
    description: Deals with this quarter's bookings, new logos, and marketing pipeline flags.
    columns:
      - name: opportunity_id
        data_tests: [unique, not_null]
      - name: q4_won_arr
        data_tests: [not_null]
      - name: q4_new_logo
        data_tests: [not_null]

  - name: fct_portfolio_studies
    description: Studies in the last 30 complete days for active accounts. The open two days are out.
    columns:
      - name: study_id
        data_tests: [unique, not_null]
      - name: account_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_accounts')
                field: account_id
      - name: ai_used
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]

  - name: mart_goal_status
    description: Current value, target, and on track / at risk / behind for each goal. Status is computed here.
    columns:
      - name: goal_id
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["on_track", "at_risk", "behind"]
      - name: current_label
        data_tests: [not_null]
      - name: target_label
        data_tests: [not_null]
      - name: status_label
        data_tests: [not_null]

  - name: mart_actions_this_week
    description: Three to five plain-English actions written from the marts.
    columns:
      - name: action_id
        data_tests: [unique, not_null]
      - name: sort_order
        data_tests: [unique, not_null]
      - name: section_id
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["customers", "sales-bookings", "sales-win", "marketing", "time-saved", "sales-funnel"]
      - name: sentence
        data_tests: [not_null]

  - name: mart_monthly_bookings
    description: Won ARR by month, with the monthly bookings goal.
    columns:
      - name: month_start
        data_tests: [unique, not_null]
      - name: bookings_arr
        data_tests: [not_null]
      - name: monthly_goal
        data_tests: [not_null]

  - name: mart_funnel
    description: How many deals reached each stage since the funnel window opened.
    columns:
      - name: stage
        data_tests: [unique, not_null]
      - name: stage_rank
        data_tests: [unique, not_null]
      - name: reached
        data_tests: [not_null]

  - name: mart_win_rate
    description: Closed-won share by segment since the start of the year.
    columns:
      - name: segment
        data_tests: [unique, not_null]
      - name: win_rate
        data_tests: [not_null]
      - name: closed_deals
        data_tests: [not_null]

  - name: mart_channel_performance
    description: Spend, opportunities, cost per opportunity, and pipeline by channel this quarter.
    columns:
      - name: channel
        data_tests: [unique, not_null]
      - name: opportunities
        data_tests: [not_null]
      - name: pipeline_arr
        data_tests: [not_null]
      - name: cost_per_opportunity
        data_tests: [not_null]

  - name: mart_account_health
    description: Adoption, trend, renewal, and a health score for each active account.
    columns:
      - name: account_id
        data_tests: [unique, not_null]
      - name: trend
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["up", "down", "flat", "new"]
      - name: health_band
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["healthy", "watch", "risk"]
      - name: renewal_at_risk
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]

  - name: mart_time_saved
    description: One before and after for time on the report, same mix of scans.
    columns:
      - name: before_minutes
        data_tests: [not_null]
      - name: after_minutes
        data_tests: [not_null]
      - name: minutes_faster
        data_tests: [not_null]
      - name: caption
        data_tests: [not_null]
