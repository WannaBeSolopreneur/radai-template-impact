version: 2

semantic_models:
  - name: studies
    description: >
      One row per Northbay study in the metric window. Test fixtures are gone.
      The last two days are gone because that feed is still loading.
    model: ref('fct_studies_metric')
    defaults:
      agg_time_dimension: exam_completed_at
    entities:
      - name: study
        type: primary
        expr: study_id
      - name: site
        type: foreign
        expr: site_id
      - name: customer
        type: foreign
        expr: customer_id
      - name: radiologist
        type: foreign
        expr: radiologist_id
    dimensions:
      - name: exam_completed_at
        type: time
        type_params:
          time_granularity: day
      - name: modality
        type: categorical
      - name: specialty
        type: categorical
      - name: priority
        type: categorical
      - name: period
        type: categorical
      - name: template_version
        type: categorical
      - name: site_name
        type: categorical
    measures:
      - name: studies
        description: Studies in the metric window.
        agg: count
        expr: study_id
      - name: median_turnaround_minutes
        description: Median minutes from exam completed to report signed.
        agg: median
        expr: turnaround_minutes
      - name: median_time_on_report_minutes
        description: Median minutes from report started to report signed.
        agg: median
        expr: time_on_report_minutes
      - name: median_words
        description: Median dictated words on the report.
        agg: median
        expr: words_dictated
      - name: templates_used
        description: Studies that used a template.
        agg: sum
        expr: used_template
      - name: ai_accepted
        description: AI impressions the radiologist accepted.
        agg: sum
        expr: is_ai_accepted
      - name: ai_scored
        description: Studies where AI produced an impression.
        agg: sum
        expr: is_ai_scored

  - name: case_mix_change
    description: >
      One row per customer. Medians are compared inside each modality, then
      weighted by the pre-launch mix. A negative change means faster.
    model: ref('mart_case_mix_change')
    defaults:
      agg_time_dimension: launch_at
    entities:
      - name: customer
        type: primary
        expr: customer_id
    dimensions:
      - name: launch_at
        type: time
        type_params:
          time_granularity: day
    measures:
      - name: adjusted_turnaround_change_minutes
        description: Mix-adjusted change in median turnaround. Negative means faster.
        agg: sum
        expr: adjusted_change_minutes
      - name: adjusted_report_change_minutes
        description: Mix-adjusted change in median time on report. Negative means faster.
        agg: sum
        expr: adjusted_report_change_minutes
      - name: raw_turnaround_change_minutes
        description: Change in the raw median turnaround. This follows the case mix.
        agg: sum
        expr: raw_change_minutes

  - name: opportunities
    description: >
      One row per deal. Quarter flags mark bookings, new logos, and
      marketing-sourced pipeline for the open quarter.
    model: ref('fct_opportunities')
    defaults:
      agg_time_dimension: created_at
    entities:
      - name: opportunity
        type: primary
        expr: opportunity_id
      - name: account
        type: foreign
        expr: account_id
    dimensions:
      - name: created_at
        type: time
        type_params:
          time_granularity: day
      - name: buyer_segment
        type: categorical
        expr: segment
      - name: stage
        type: categorical
      - name: outcome
        type: categorical
      - name: source_channel
        type: categorical
        expr: channel
    measures:
      - name: opportunity_rows
        description: Deals on the fact.
        agg: count
        expr: opportunity_id
      - name: quarter_bookings_arr
        description: Closed-won ARR in the open quarter.
        agg: sum
        expr: q4_won_arr
      - name: quarter_new_logos
        description: First-time customers closed in the open quarter.
        agg: sum
        expr: q4_new_logo
      - name: quarter_marketing_pipeline_arr
        description: Marketing-sourced pipeline that reached a meeting this quarter.
        agg: sum
        expr: q4_marketing_arr

  - name: goal_status
    description: >
      One row per goal. Status is on track, at risk, or behind.
      Pace goals compare with a straight line through the quarter.
      Snapshot goals compare with the full target.
    model: ref('mart_goal_status')
    defaults:
      agg_time_dimension: as_of
    entities:
      - name: goal
        type: primary
        expr: goal_id
    dimensions:
      - name: as_of
        type: time
        type_params:
          time_granularity: day
      - name: status
        type: categorical
      - name: metric_kind
        type: categorical
    measures:
      - name: goal_current_value
        description: The live value for the goal.
        agg: sum
        expr: current_value
      - name: goal_target_value
        description: The target for the goal.
        agg: sum
        expr: target_value

  - name: channel_performance
    description: Spend and pipeline by marketing or outbound channel this quarter.
    model: ref('mart_channel_performance')
    defaults:
      agg_time_dimension: as_of
    entities:
      - name: marketing_channel
        type: primary
        expr: channel
    dimensions:
      - name: as_of
        type: time
        type_params:
          time_granularity: day
      - name: channel_name
        type: categorical
      - name: sort_order
        type: categorical
    measures:
      - name: channel_spend_amount
        description: Spend on the channel this quarter.
        agg: sum
        expr: spend
      - name: channel_opportunity_count
        description: Opportunities created this quarter that reached a meeting.
        agg: sum
        expr: opportunities
      - name: channel_pipeline_arr
        description: ARR on those opportunities.
        agg: sum
        expr: pipeline_arr

  - name: win_rate_segment
    description: Closed deals and wins by segment.
    model: ref('mart_win_rate')
    defaults:
      agg_time_dimension: as_of
    entities:
      - name: win_segment
        type: primary
        expr: segment
    dimensions:
      - name: as_of
        type: time
        type_params:
          time_granularity: day
    measures:
      - name: closed_deal_count
        description: Deals closed won or lost in the win-rate window.
        agg: sum
        expr: closed_deals
      - name: won_deal_count
        description: Deals closed won in the win-rate window.
        agg: sum
        expr: won_deals

  - name: account_health
    description: One row per active account, with adoption and a health score.
    model: ref('mart_account_health')
    defaults:
      agg_time_dimension: renewal_date
    entities:
      - name: account
        type: primary
        expr: account_id
    dimensions:
      - name: renewal_date
        type: time
        type_params:
          time_granularity: day
      - name: buyer_segment
        type: categorical
        expr: segment
      - name: trend
        type: categorical
      - name: health_band
        type: categorical
    measures:
      - name: account_arr
        description: Current ARR on the account.
        agg: sum
        expr: arr
      - name: account_rows
        description: Active accounts.
        agg: count
        expr: account_id
      - name: health_score_value
        description: Health score from adoption and the usage trend.
        agg: average
        expr: health_score

metrics:
  - name: study_count
    label: Study count
    description: Studies in the metric window after fixtures and the open days are removed.
    type: simple
    type_params:
      measure: studies

  - name: templates_used_count
    label: Templates used
    description: Studies that used a template.
    type: simple
    type_params:
      measure: templates_used

  - name: ai_accepted_count
    label: AI impressions accepted
    description: AI impressions the radiologist accepted.
    type: simple
    type_params:
      measure: ai_accepted

  - name: ai_scored_count
    label: AI impressions scored
    description: Studies where AI produced an impression.
    type: simple
    type_params:
      measure: ai_scored

  - name: median_report_turnaround
    label: Median report turnaround
    description: >
      Median minutes from exam completed to report signed. The last two days
      are excluded because they are still loading. A group with fewer than 30
      studies is flagged and is not treated as a stable number.
    type: simple
    type_params:
      measure: median_turnaround_minutes

  - name: median_time_on_report
    label: Median time on report
    description: >
      Median minutes from report started to report signed. This is the clock
      the template can move. Queue time from the exam is not in this metric.
    type: simple
    type_params:
      measure: median_time_on_report_minutes

  - name: ai_impression_acceptance_rate
    label: AI impression acceptance rate
    description: >
      Accepted AI impressions divided by impressions that were accepted, edited,
      or rejected. Studies with no AI impression are not in the denominator.
    type: ratio
    type_params:
      numerator: ai_accepted_count
      denominator: ai_scored_count

  - name: template_usage_rate
    label: Template usage rate
    description: Studies that used a template, divided by studies in the slice.
    type: ratio
    type_params:
      numerator: templates_used_count
      denominator: study_count

  - name: words_dictated_per_report
    label: Words dictated per report
    description: Median dictated words on a signed report.
    type: simple
    type_params:
      measure: median_words

  - name: case_mix_adjusted_turnaround_change
    label: Case-mix-adjusted turnaround change
    description: >
      Median turnaround after the launch minus median turnaround before it,
      inside each modality, then weighted by the pre-launch modality mix.
      A negative number means faster. The raw median is a different metric
      and will follow a shift toward MRI.
    type: simple
    type_params:
      measure: adjusted_turnaround_change_minutes

  - name: case_mix_adjusted_time_on_report_change
    label: Case-mix-adjusted time on report change
    description: >
      Same weight as the turnaround change, applied to median time on report.
      This is the direct read on whether the templates saved dictation time.
      A negative number means faster.
    type: simple
    type_params:
      measure: adjusted_report_change_minutes

  - name: quarter_bookings
    label: Quarterly new bookings
    description: Closed-won ARR since the quarter started.
    type: simple
    type_params:
      measure: quarter_bookings_arr

  - name: quarter_new_logo_count
    label: New logos
    description: First-time customers closed since the quarter started.
    type: simple
    type_params:
      measure: quarter_new_logos

  - name: quarter_marketing_pipeline
    label: Marketing-sourced pipeline
    description: >
      ARR on marketing-sourced deals created this quarter that reached a meeting.
      Outbound is not included.
    type: simple
    type_params:
      measure: quarter_marketing_pipeline_arr

  - name: channel_spend
    label: Channel spend
    description: Spend recorded for a channel this quarter.
    type: simple
    type_params:
      measure: channel_spend_amount

  - name: channel_opportunities
    label: Channel opportunities
    description: Opportunities created this quarter that reached a meeting.
    type: simple
    type_params:
      measure: channel_opportunity_count

  - name: channel_pipeline
    label: Channel pipeline
    description: ARR on opportunities created this quarter that reached a meeting.
    type: simple
    type_params:
      measure: channel_pipeline_arr

  - name: cost_per_opportunity
    label: Cost per opportunity
    description: Channel spend divided by opportunities that reached a meeting.
    type: ratio
    type_params:
      numerator: channel_spend
      denominator: channel_opportunities

  - name: segment_win_rate
    label: Win rate by segment
    description: Closed-won deals divided by closed-won and closed-lost deals.
    type: ratio
    type_params:
      numerator: won_deals_metric
      denominator: closed_deals_metric

  - name: won_deals_metric
    label: Won deals
    description: Deals closed won in the win-rate window.
    type: simple
    type_params:
      measure: won_deal_count

  - name: closed_deals_metric
    label: Closed deals
    description: Deals closed won or lost in the win-rate window.
    type: simple
    type_params:
      measure: closed_deal_count

  - name: active_account_count
    label: Active accounts
    description: Accounts currently on the book.
    type: simple
    type_params:
      measure: account_rows

  - name: book_arr
    label: Booked ARR
    description: ARR on active accounts.
    type: simple
    type_params:
      measure: account_arr
